# GERA O APK DA TV BOX NA NUVEM (GitHub Actions) - SEM INSTALAR A UNITY NO PC.
#
# Como usar: aba "Actions" do repositorio > "Gerar APK (TV Box)" > "Run workflow".
# No fim (uns 30 a 60 minutos), o APK aparece no fim da pagina da execucao,
# em "Artifacts" (StrikeKids-Unity-APK). Antes da 1a vez: os 3 segredos da
# licenca Personal da Unity (gratis) - passo a passo em docs/GERAR_APK_NA_NUVEM.md.
#
# Quem roda a Unity e o GameCI (imagem unityci/editor com a Unity 2022.3 e o
# modulo Android), chamando o mesmo metodo do GERAR_APK.bat
# (StrikeKids.Editor.Construir.Apk): configura OpenGL ES 2.0, calibra as jogadas
# se precisar, assina com a chave do projeto e gera o APK.
name: Gerar APK (TV Box)

on:
  workflow_dispatch:
    inputs:
      giro:
        description: "Giro de fabrica da tela (1 = TV Box deitada, o padrao; -1 = para o outro lado; 0 = sem giro)"
        required: true
        default: "1"
        type: choice
        options: ["1", "-1", "0"]
      versao:
        description: "Versao do jogo (vazio = 6.0)"
        required: false
        default: ""
      arm64:
        description: "Incluir tambem ARM64 (mais lento; a TX9 so precisa de ARMv7)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gerar-apk
  cancel-in-progress: false

jobs:
  apk:
    name: APK da TV Box
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Abrir espaco no disco (a Unity com Android e grande)
        uses: jlumbroso/free-disk-space@v1.3.1

      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Reaproveitar a importacao da ultima vez (pasta Library)
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      - name: Gerar o APK com a Unity 2022.3 (OpenGL ES 2.0)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: auto
          versioning: None
          buildName: StrikeKids-Unity
          buildMethod: StrikeKids.Editor.Construir.Apk
          androidExportType: androidPackage
          customParameters: >-
            -saida build/Android/StrikeKids-Unity.apk
            -giro ${{ inputs.giro }}
            ${{ inputs.versao != '' && format('-versao {0}', inputs.versao) || '' }}
            ${{ inputs.arm64 && ' ' || '-so32' }}

      - name: Entregar o APK (fica no fim da pagina, em Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: StrikeKids-Unity-APK
          path: build/Android/StrikeKids-Unity.apk
          if-no-files-found: error
          retention-days: 30
